version: '3.1'
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq4-m
    ports:
      - 5672:5672
      - 15672:15672
  mailpit:
    image: axllent/mailpit:v1.15
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
  db:
    image: postgres:${POSTGRES_VERSION:-15}-alpine
    container_name: resourceDb1
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sa}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    ports:
      - 5437:5432
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    networks:
      - homeland  # <-- Ajoutez cette ligne

  adminer:
    image: adminer
    restart: always
    ports:
      - 8082:8080
    # environment:
    #   ADMINER_DEFAULT_SERVER: 194.164.196.232
    # Optionnel : forcer l'utilisation du réseau host
    # network_mode: host
    networks:
      - homeland
volumes:
  ###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###

networks:
  homeland:
    driver: bridge
